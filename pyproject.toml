[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alphaagents-cn"
version = "0.3.0"
description = "AlphaAgents-CN: A 股多智能体投研系统，基于 TradingAgents 架构"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "AlphaAgents-CN Contributors" }]
keywords = ["tradingagents", "a-share", "multi-agent", "llm", "quant", "stock-analysis"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "akshare>=1.18.0",
    "baostock>=0.8.8",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.0",
    "langchain-core>=0.3.81",
    "backtrader>=1.9.78.123",
    "langchain-anthropic>=0.3.15",
    "langchain-experimental>=0.3.4",
    "langchain-google-genai>=2.1.5",
    "langchain-openai>=0.3.23",
    "langgraph>=0.4.8",
    "pandas>=2.3.0",
    "pytz>=2025.2",
    "questionary>=2.1.0",
    "rank-bm25>=0.2.2",
    "redis>=6.2.0",
    "requests>=2.32.4",
    "rich>=14.0.0",
    "typer>=0.21.0",
    "setuptools>=80.9.0",
    "stockstats>=0.6.5",
    "tqdm>=4.67.1",
    "typing-extensions>=4.14.0",
    "yfinance>=0.2.63",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[project.scripts]
alphaagents = "cli.main:app"
tradingagents = "cli.main:app"

[project.urls]
Homepage = "https://github.com/hebjt2024/AlphaAgents-CN"
Upstream = "https://github.com/TauricResearch/TradingAgents"

[tool.setuptools.packages.find]
include = ["tradingagents*", "cli*", "webui*"]

[tool.setuptools.package-data]
cli = ["static/*"]
webui = ["frontend/*", "frontend/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "webui/frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# 根目录 test.py 是手动调试脚本，保留全部导入便于按需取消注释
"test.py" = ["F401"]
# 这些文件使用有意的星号导入（facade / 代理注册表）或先 load_dotenv 再导入
"cli/main.py" = ["E402", "F403", "F405"]
"tradingagents/agents/utils/agent_states.py" = ["F403"]
"tradingagents/dataflows/alpha_vantage.py" = ["F403", "F405"]
"tradingagents/graph/setup.py" = ["F403", "F405"]
"tradingagents/graph/trading_graph.py" = ["F403", "F405"]

