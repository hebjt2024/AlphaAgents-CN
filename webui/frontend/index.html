<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TradingAgents - 多智能体金融交易分析</title>
<style>
  /* ====== CSS 变量（主题色） ====== */
  :root {
    --bg-primary: #0f1117;
    --bg-secondary: #1a1d27;
    --bg-card: #1e2130;
    --bg-input: #252836;
    --bg-hover: #2a2d3a;
    --border: #2e3140;
    --border-active: #4a6cf7;
    --text-primary: #e4e6ed;
    --text-secondary: #8b8fa3;
    --text-muted: #5a5e72;
    --accent: #4a6cf7;
    --accent-hover: #5b7cf8;
    --green: #22c55e;
    --green-bg: rgba(34, 197, 94, 0.1);
    --red: #ef4444;
    --red-bg: rgba(239, 68, 68, 0.1);
    --yellow: #eab308;
    --yellow-bg: rgba(234, 179, 8, 0.1);
    --blue: #3b82f6;
    --blue-bg: rgba(59, 130, 246, 0.1);
    --purple: #a855f7;
    --purple-bg: rgba(168, 85, 247, 0.1);
    --radius: 8px;
    --radius-lg: 12px;
    --shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
  }

  /* ====== 全局样式 ====== */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ====== 顶部导航栏 ====== */
  .navbar {
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .navbar-brand {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .navbar-brand .icon {
    width: 32px;
    height: 32px;
    background: linear-gradient(135deg, var(--accent), var(--purple));
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-muted);
    display: inline-block;
    margin-right: 6px;
    transition: background 0.3s;
  }
  .status-dot.connected { background: var(--green); }
  .status-dot.running { background: var(--yellow); animation: pulse 1.5s infinite; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* ====== 主布局 ====== */
  .main-container {
    display: flex;
    height: calc(100vh - 57px);
    overflow: hidden;
  }

  /* ====== 左侧面板（配置） ====== */
  .sidebar {
    width: 380px;
    min-width: 380px;
    background: var(--bg-secondary);
    border-right: 1px solid var(--border);
    padding: 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .sidebar h2 {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .form-group label {
    font-size: 13px;
    color: var(--text-secondary);
    font-weight: 500;
  }
  .form-group input,
  .form-group select {
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    color: var(--text-primary);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }
  .form-group input:focus,
  .form-group select:focus {
    border-color: var(--border-active);
  }
  .form-row {
    display: flex;
    gap: 10px;
  }
  .form-row .form-group { flex: 1; }
  .btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 12px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    width: 100%;
  }
  .btn:hover { background: var(--accent-hover); transform: translateY(-1px); }
  .btn:disabled {
    background: var(--bg-input);
    color: var(--text-muted);
    cursor: not-allowed;
    transform: none;
  }
  .btn-stop {
    background: var(--red);
  }
  .btn-stop:hover {
    background: #dc2626;
  }

  /* ====== 右侧面板（日志） ====== */
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .log-header {
    background: var(--bg-secondary);
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .log-header h3 {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-secondary);
  }
  .log-header .badge {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 12px;
    color: var(--text-muted);
  }
  .log-container {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .log-container::-webkit-scrollbar {
    width: 6px;
  }
  .log-container::-webkit-scrollbar-track {
    background: transparent;
  }
  .log-container::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 3px;
  }

  /* ====== 日志条目 ====== */
  .log-entry {
    padding: 10px 14px;
    border-radius: var(--radius);
    border-left: 3px solid transparent;
    background: var(--bg-card);
    animation: slideIn 0.3s ease;
    font-size: 13px;
    line-height: 1.5;
    word-break: break-word;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-10px); }
    to { opacity: 1; transform: translateX(0); }
  }
  .log-entry.node_change {
    border-left-color: var(--purple);
    background: var(--purple-bg);
    font-weight: 600;
    font-size: 14px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .log-entry.node_change::before {
    content: "▸";
    color: var(--purple);
    font-size: 16px;
  }
  .log-entry.ai {
    border-left-color: var(--blue);
    background: var(--blue-bg);
  }
  .log-entry.tool {
    border-left-color: var(--yellow);
    background: var(--yellow-bg);
    font-size: 12px;
    color: var(--text-secondary);
  }
  .log-entry.system {
    border-left-color: var(--text-muted);
    background: var(--bg-input);
    font-size: 12px;
    color: var(--text-muted);
    font-style: italic;
  }
  .log-entry.error {
    border-left-color: var(--red);
    background: var(--red-bg);
    color: var(--red);
  }

  /* ====== 结果面板 ====== */
  .result-panel {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 24px;
    margin: 16px;
    display: none;
    flex-shrink: 0;
    max-height: 45vh;
    overflow-y: auto;
  }
  .result-panel.visible { display: block; }
  .result-decision {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 20px;
    border-radius: 20px;
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 16px;
  }
  .result-decision.buy {
    background: var(--green-bg);
    color: var(--green);
    border: 1px solid var(--green);
  }
  .result-decision.sell {
    background: var(--red-bg);
    color: var(--red);
    border: 1px solid var(--red);
  }
  .result-decision.hold {
    background: var(--yellow-bg);
    color: var(--yellow);
    border: 1px solid var(--yellow);
  }
  .result-section {
    margin-top: 16px;
  }
  .result-section h4 {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .result-section p {
    font-size: 13px;
    line-height: 1.7;
    color: var(--text-primary);
    white-space: pre-wrap;
  }

  /* ====== 空状态 ====== */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--text-muted);
    gap: 12px;
    text-align: center;
  }
  .empty-state .icon {
    font-size: 48px;
    opacity: 0.3;
  }
  .empty-state p {
    font-size: 14px;
    max-width: 300px;
  }

  /* ====== 响应式 ====== */
  @media (max-width: 900px) {
    .main-container { flex-direction: column; }
    .sidebar {
      width: 100%;
      min-width: 100%;
      max-height: 40vh;
      border-right: none;
      border-bottom: 1px solid var(--border);
    }
  }
</style>
</head>
<body>

<!-- 导航栏 -->
<nav class="navbar">
  <div class="navbar-brand">
    <div class="icon">T</div>
    TradingAgents
  </div>
  <div style="display:flex;align-items:center;gap:12px;">
    <span id="connectionStatus" style="font-size:12px;color:var(--text-muted);">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">未连接</span>
    </span>
  </div>
</nav>

<!-- 主布局 -->
<div class="main-container">
  <!-- 左侧配置面板 -->
  <aside class="sidebar">
    <h2>分析配置</h2>

    <div class="form-row">
      <div class="form-group">
        <label>股票代码</label>
        <input type="text" id="company" value="NVDA" placeholder="如 NVDA, AAPL, 海南橡胶">
      </div>
      <div class="form-group">
        <label>分析日期</label>
        <input type="date" id="date" value="2024-05-10">
      </div>
    </div>

    <div class="form-group">
      <label>LLM 提供商</label>
      <select id="llmProvider">
        <option value="anthropic" selected>Anthropic (Claude / MiniMax)</option>
        <option value="openai">OpenAI (GPT 系列)</option>
        <option value="google">Google (Gemini)</option>
      </select>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>深度思考模型</label>
        <input type="text" id="deepThinkLLM" value="MiniMax-M3" placeholder="如 MiniMax-M3, gpt-5-mini">
      </div>
      <div class="form-group">
        <label>快速思考模型</label>
        <input type="text" id="quickThinkLLM" value="MiniMax-M2.5" placeholder="如 MiniMax-M2.5">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>辩论轮数</label>
        <input type="number" id="maxDebateRounds" value="1" min="1" max="5">
      </div>
      <div class="form-group">
        <label>风险讨论轮数</label>
        <input type="number" id="maxRiskRounds" value="1" min="1" max="5">
      </div>
    </div>

    <button class="btn" id="startBtn" onclick="startAnalysis()">
      开始分析
    </button>
    <button class="btn btn-stop" id="stopBtn" onclick="stopAnalysis()" style="display:none;">
      停止分析
    </button>

    <div style="margin-top:auto;padding-top:16px;border-top:1px solid var(--border);">
      <p style="font-size:11px;color:var(--text-muted);line-height:1.5;">
        分析流程：市场数据 → 新闻/社交媒体 → 基本面 → 多空辩论 → 风险评估 → 交易决策<br>
        分析过程需要 1-3 分钟，请在右侧查看实时进度
      </p>
    </div>
  </aside>

  <!-- 右侧日志面板 -->
  <div class="content">
    <div class="log-header">
      <h3>分析日志</h3>
      <span class="badge" id="msgCount">0 条消息</span>
    </div>
    <div class="log-container" id="logContainer">
      <div class="empty-state">
        <div class="icon">📊</div>
        <p>在左侧配置分析参数，点击"开始分析"启动多智能体交易分析</p>
      </div>
    </div>
    <!-- 结果面板 -->
    <div class="result-panel" id="resultPanel">
      <div id="decisionBadge"></div>
      <div class="result-section" id="decisionSection">
        <h4>最终决策</h4>
        <p id="decisionText"></p>
      </div>
      <div class="result-section" id="marketSection" style="display:none;">
        <h4>市场分析报告</h4>
        <p id="marketReport"></p>
      </div>
      <div class="result-section" id="newsSection" style="display:none;">
        <h4>新闻分析报告</h4>
        <p id="newsReport"></p>
      </div>
      <div class="result-section" id="fundamentalsSection" style="display:none;">
        <h4>基本面分析报告</h4>
        <p id="fundamentalsReport"></p>
      </div>
      <div class="result-section" id="planSection" style="display:none;">
        <h4>交易计划</h4>
        <p id="investmentPlan"></p>
      </div>
    </div>
  </div>
</div>

<script>
  // ====== WebSocket 连接管理 ======
  let ws = null;
  let reconnectTimer = null;
  let msgCount = 0;
  let isRunning = false;

  function connectWebSocket() {
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = `${protocol}//${window.location.host}/ws`;

    ws = new WebSocket(wsUrl);

    ws.onopen = () => {
      updateConnectionStatus('connected', '已连接');
      // 启动心跳
      startHeartbeat();
    };

    ws.onmessage = (event) => {
      const msg = JSON.parse(event.data);
      handleMessage(msg);
    };

    ws.onclose = () => {
      updateConnectionStatus('disconnected', '断开连接');
      stopHeartbeat();
      // 自动重连
      reconnectTimer = setTimeout(connectWebSocket, 3000);
    };

    ws.onerror = () => {
      updateConnectionStatus('disconnected', '连接错误');
    };
  }

  let heartbeatTimer = null;
  function startHeartbeat() {
    heartbeatTimer = setInterval(() => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send('ping');
      }
    }, 30000);
  }
  function stopHeartbeat() {
    if (heartbeatTimer) {
      clearInterval(heartbeatTimer);
      heartbeatTimer = null;
    }
  }

  function updateConnectionStatus(state, text) {
    const dot = document.getElementById('statusDot');
    const textEl = document.getElementById('statusText');
    if (state === 'connected') {
      dot.className = 'status-dot connected';
      textEl.textContent = text;
    } else if (state === 'running') {
      dot.className = 'status-dot running';
      textEl.textContent = text;
    } else {
      dot.className = 'status-dot';
      textEl.textContent = text;
    }
  }

  // ====== 消息处理 ======
  function handleMessage(msg) {
    const logContainer = document.getElementById('logContainer');

    switch (msg.type) {
      case 'status':
        // 更新状态
        if (msg.data.running) {
          isRunning = true;
          updateConnectionStatus('running', '分析中...');
          document.getElementById('startBtn').style.display = 'none';
          document.getElementById('stopBtn').style.display = 'block';
          // 隐藏结果面板
          document.getElementById('resultPanel').classList.remove('visible');
          // 清空日志
          logContainer.innerHTML = '';
          msgCount = 0;
          document.getElementById('msgCount').textContent = '0 条消息';
        } else {
          isRunning = false;
          updateConnectionStatus('connected', '已连接');
          document.getElementById('startBtn').style.display = 'block';
          document.getElementById('stopBtn').style.display = 'none';
        }
        break;

      case 'analysis_start':
        addLogEntry('system', `开始分析: ${msg.data.company} (${msg.data.date})`);
        break;

      case 'node_change':
        addLogEntry('node_change', msg.data.display);
        break;

      case 'message':
        addLogEntry(
          msg.data.msg_type === 'AIMessage' ? 'ai' :
          msg.data.msg_type === 'ToolMessage' ? 'tool' : 'system',
          msg.data.content
        );
        break;

      case 'progress':
        addLogEntry('system', msg.data.message);
        break;

      case 'analysis_complete':
        isRunning = false;
        updateConnectionStatus('connected', '已连接');
        document.getElementById('startBtn').style.display = 'block';
        document.getElementById('stopBtn').style.display = 'none';
        showResults(msg.data);
        break;

      case 'error':
        addLogEntry('error', msg.data.message);
        isRunning = false;
        updateConnectionStatus('connected', '已连接');
        document.getElementById('startBtn').style.display = 'block';
        document.getElementById('stopBtn').style.display = 'none';
        break;
    }
  }

  function addLogEntry(type, text) {
    const logContainer = document.getElementById('logContainer');
    // 移除空状态
    const emptyState = logContainer.querySelector('.empty-state');
    if (emptyState) emptyState.remove();

    const entry = document.createElement('div');
    entry.className = `log-entry ${type}`;
    entry.textContent = text;
    logContainer.appendChild(entry);

    // 自动滚动到底部
    logContainer.scrollTop = logContainer.scrollHeight;

    // 更新计数
    msgCount++;
    document.getElementById('msgCount').textContent = `${msgCount} 条消息`;
  }

  // ====== 结果显示 ======
  function showResults(data) {
    const panel = document.getElementById('resultPanel');
    panel.classList.add('visible');

    // 决策徽章
    const badge = document.getElementById('decisionBadge');
    const decision = data.decision || 'HOLD';
    let badgeClass = 'hold';
    if (decision === 'BUY') badgeClass = 'buy';
    else if (decision === 'SELL') badgeClass = 'sell';
    badge.innerHTML = `<span class="result-decision ${badgeClass}">${getDecisionEmoji(decision)} ${decision}</span>`;

    // 决策文本
    document.getElementById('decisionText').textContent = data.decision_text || '无';

    // 报告
    showReportSection('marketSection', 'marketReport', data.reports?.market_report);
    showReportSection('newsSection', 'newsReport', data.reports?.news_report);
    showReportSection('fundamentalsSection', 'fundamentalsReport', data.reports?.fundamentals_report);
    showReportSection('planSection', 'investmentPlan', data.reports?.investment_plan);

    // 滚动到结果面板
    panel.scrollIntoView({ behavior: 'smooth' });
  }

  function getDecisionEmoji(decision) {
    switch (decision) {
      case 'BUY': return '📈';
      case 'SELL': return '📉';
      case 'HOLD': return '📊';
      default: return '📊';
    }
  }

  function showReportSection(sectionId, elementId, content) {
    const section = document.getElementById(sectionId);
    const element = document.getElementById(elementId);
    if (content && content.trim()) {
      section.style.display = 'block';
      element.textContent = content;
    } else {
      section.style.display = 'none';
    }
  }

  // ====== 分析控制 ======
  async function startAnalysis() {
    if (isRunning) return;

    const company = document.getElementById('company').value.trim();
    const date = document.getElementById('date').value;
    if (!company || !date) {
      alert('请填写股票代码和分析日期');
      return;
    }

    const payload = {
      company: company,
      date: date,
      llm_provider: document.getElementById('llmProvider').value,
      deep_think_llm: document.getElementById('deepThinkLLM').value,
      quick_think_llm: document.getElementById('quickThinkLLM').value,
      max_debate_rounds: parseInt(document.getElementById('maxDebateRounds').value) || 1,
      max_risk_discuss_rounds: parseInt(document.getElementById('maxRiskRounds').value) || 1,
    };

    try {
      const resp = await fetch('/api/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const result = await resp.json();
      if (!result.success) {
        alert(result.message);
      }
    } catch (e) {
      alert('请求失败: ' + e.message);
    }
  }

  function stopAnalysis() {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'stop' }));
    }
    location.reload();
  }

  // ====== 初始化 ======
  connectWebSocket();
</script>
</body>
</html>
