    display: inline-block;
    margin-top: 4px;
    font-size: 11px;
    color: var(--accent);
    cursor: pointer;
    user-select: none;
    background: none;
    border: none;
    padding: 2px 0;
    font-family: var(--font);
  }
  .collapse-toggle:hover { color: var(--accent-hover); text-decoration: underline; }

  /* 节点类别配色（消息左侧色条更精细） */
  .log-entry.cat-analyst    { border-left-color: var(--accent); }
  .log-entry.cat-tool       { border-left-color: var(--gold); }
  .log-entry.cat-clearer    { border-left-color: var(--text-muted); opacity: 0.7; }
  .log-entry.cat-researcher { border-left-color: var(--green); }
  .log-entry.cat-manager    { border-left-color: var(--purple); }
  .log-entry.cat-trader     { border-left-color: var(--cyan); }
  .log-entry.cat-risk       { border-left-color: var(--red); }
  .log-entry.cat-portfolio  { border-left-color: var(--purple); }
  .log-entry.cat-system     { border-left-color: var(--text-muted); }

  /* 节点标签（消息上方的发言人标签） */
  .msg-speaker {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .msg-speaker .speaker-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
  }
  .log-entry.cat-tool .msg-speaker .speaker-dot { background: var(--gold); }
  .log-entry.cat-researcher .msg-speaker .speaker-dot { background: var(--green); }
  .log-entry.cat-manager .msg-speaker .speaker-dot,
  .log-entry.cat-portfolio .msg-speaker .speaker-dot { background: var(--purple); }
  .log-entry.cat-trader .msg-speaker .speaker-dot { background: var(--cyan); }
  .log-entry.cat-risk .msg-speaker .speaker-dot { background: var(--red); }
  .log-entry.cat-clearer .msg-speaker .speaker-dot,
  .log-entry.cat-system .msg-speaker .speaker-dot { background: var(--text-muted); }

  /* 日志中的迷你报告卡片（report_ready 事件渲染） */
  .log-entry.report-card-entry {
    background: var(--bg-input);
    border-left-color: var(--green);
    padding: 12px 14px;
  }
  .log-entry.report-card-entry .report-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--green);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .log-entry.report-card-entry .report-title::before {
    content: '✓';
    color: var(--green);
    font-size: 14px;
  }
  .log-entry.report-card-entry .report-content {
    font-size: 13px;
    line-height: 1.6;
    color: var(--text);
  }

  /* 五级决策徽章 */
  .decision-badge.buy,
  .decision-badge.overweight {
    background: var(--green-bg);
    color: var(--green);
    border: 1px solid rgba(34, 197, 94, 0.3);
  }
  .decision-badge.sell,
  .decision-badge.underweight {
    background: var(--red-bg);
    color: var(--red);
    border: 1px solid rgba(239, 68, 68, 0.3);
  }
  .decision-badge.hold {
    background: var(--gold-bg);
    color: var(--gold);
    border: 1px solid rgba(245, 158, 11, 0.3);
  }

  /* 报告卡片中的 Markdown 渲染 */
  .report-card-body.markdown {
    white-space: normal;
  }
  .report-card-body.markdown h1,
  .report-card-body.markdown h2,
  .report-card-body.markdown h3,
  .report-card-body.markdown h4 {
    color: var(--text);
    margin: 12px 0 6px;
    font-size: 14px;
    font-weight: 700;
  }
  .report-card-body.markdown h1 { font-size: 16px; }
  .report-card-body.markdown p { margin: 6px 0; }
  .report-card-body.markdown strong { color: var(--accent-hover); }
  .report-card-body.markdown em { color: var(--text-secondary); font-style: italic; }
  .report-card-body.markdown code {
    background: var(--bg-card);
    padding: 1px 6px;
    border-radius: 4px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--gold);
  }
  .report-card-body.markdown pre {
    background: var(--bg-root);
    padding: 10px 12px;
    border-radius: 6px;
    overflow-x: auto;
    font-size: 12px;
    margin: 6px 0;
    border: 1px solid var(--border);
  }
  .report-card-body.markdown pre code {
    background: transparent;
    padding: 0;
    color: var(--text);
  }
  .report-card-body.markdown ul,
  .report-card-body.markdown ol {
    padding-left: 22px;
    margin: 6px 0;
  }
  .report-card-body.markdown li { margin: 3px 0; }
  .report-card-body.markdown blockquote {
    border-left: 3px solid var(--border-light);
    padding-left: 10px;
    color: var(--text-secondary);
    margin: 6px 0;
  }
  .report-card-body.markdown table {
    border-collapse: collapse;
    width: 100%;
    font-size: 12px;
    margin: 8px 0;
  }
  .report-card-body.markdown th,
  .report-card-body.markdown td {
    border: 1px solid var(--border-light);
    padding: 6px 10px;
    text-align: left;
  }
  .report-card-body.markdown th {
    background: var(--bg-card);
    font-weight: 600;
    color: var(--text);
  }
  .report-card-body.markdown tr:nth-child(even) td {
    background: rgba(255, 255, 255, 0.02);
  }

  /* 响应式 */
  @media (max-width: 900px) {
    .main-layout { flex-direction: column; }
    .sidebar {
      width: 100%;
      min-width: 100%;
      max-height: 45vh;
      border-right: none;
      border-bottom: 1px solid var(--border);
    }
    .result-panel { max-height: 40vh; }
  }
</style>
</head>

<!-- 导航栏 -->

<!-- 主布局 -->
<div class="main-layout">
  <!-- 左侧配置面板 -->
  <aside class="sidebar">
    <div class="sidebar-section">

          <input type="number" class="form-input" id="maxDebateRounds" value="1" min="1" max="5">
          <div class="form-hint">多空辩论的最大轮次</div>
        </div>
        <div class="form-group">
          <label class="form-label">风险讨论轮数</label>
          <input type="number" class="form-input" id="maxRiskRounds" value="1" min="1" max="5">

    <div class="sidebar-section">
      <!-- 耗时显示：分析开始后实时更新，让用户感知任务在运行 -->

        <span class="pulse-dot"></span>

      <button class="btn btn-primary" id="startBtn" onclick="startAnalysis()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        <span id="startBtnText">开始分析</span>
      </button>
      <button class="btn btn-danger" id="stopBtn" onclick="stopAnalysis()" style="display:none;margin-top:8px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
        <span id="stopBtnText">停止分析</span>

    </div>

    <div class="sidebar-footer">
      分析流程：市场数据获取 → 技术指标计算 → 新闻/社交媒体分析 → 基本面评估 → 多空辩论 → 风险评估 → 最终交易决策
    </div>

  <!-- 右侧内容区 -->
  <div class="content-area">
    <div class="log-toolbar">
      <h3>分析日志</h3>
      <span class="badge" id="msgCount">等待中</span>
      <div class="progress-bar-wrap" style="flex:1;margin:0 12px;">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
      <!-- 自动滚动开关：用户向上滚动时自动暂停跟随，点击恢复 -->
      <button class="auto-scroll-btn" id="autoScrollBtn" onclick="toggleAutoScroll()" title="点击切换自动跟随最新日志">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
        <span id="autoScrollText">跟随</span>
      </button>
      <button class="btn-clear" onclick="clearLogs()">清空</button>
    </div>
    <div class="log-container" id="logContainer">
      <div class="empty-state">
        <div class="empty-icon">📊</div>
        <div class="empty-title">开始您的第一次分析</div>
        <div class="empty-desc">在左侧面板输入股票名称和分析日期，点击"开始分析"启动多智能体交易分析流程</div>
      </div>
    </div>

    <!-- 结果面板 -->
    <div class="result-panel" id="resultPanel">
      <div class="result-header">
        <h3>分析结果</h3>
        <button class="btn-clear" onclick="document.getElementById('resultPanel').classList.remove('visible')">关闭</button>
      </div>
      <div class="result-body" id="resultBody">
      </div>
    </div>
  </div>
</div>

<script>
  // ====== 全局状态 ======
  let ws = null;
  let reconnectTimer = null;
  let heartbeatTimer = null;
  let msgCount = 0;
  let isRunning = false;
  const totalStages = 14; // 分析总阶段数
  let currentStage = 0;

  // —— UX 优化相关状态 ——
  // 耗时计时器：分析开始时启动 setInterval，每秒刷新显示
  let elapsedTimerInterval = null;
  let analysisStartTime = 0;       // 分析开始时间戳（ms）
  // 自动滚动控制：默认开启，用户向上滚动时自动暂停
  let autoScrollEnabled = true;
  // 表单输入元素 id 列表：分析中统一禁用，分析结束统一恢复
  const FORM_ELEMENT_IDS = [
    'company', 'date', 'llmProvider',
    'deepThinkLLM', 'quickThinkLLM',
    'maxDebateRounds', 'maxRiskRounds',
  ];

  // ====== Markdown 渲染配置 ======
  // marked 全局配置：开启 GFM、换行转 <br>、不渲染内嵌 HTML（防 XSS）
  if (typeof marked !== 'undefined') {
    marked.setOptions({
      gfm: true,
      breaks: true,
      headerIds: false,
      mangle: false,
    });
  }

  /**
   * 将 Markdown 文本渲染为安全的 HTML。
   * 1) 用 marked 解析 Markdown → HTML 字符串
   * 2) 用 DOMPurify 清洗 HTML，移除 <script>、内嵌事件等危险节点
   * 若库未加载则退化为 HTML 转义后的纯文本。
   */
  function renderMarkdown(mdText) {
    if (!mdText) return '';
    try {
      if (typeof marked !== 'undefined' && typeof DOMPurify !== 'undefined') {
        const html = marked.parse(mdText);
        return DOMPurify.sanitize(html, {
          ALLOWED_TAGS: [
            'h1','h2','h3','h4','h5','h6','p','br','hr','strong','em','del','code','pre',
            'blockquote','ul','ol','li','table','thead','tbody','tr','th','td','a','img',
            'span','div','sub','sup'
          ],
          ALLOWED_ATTR: ['href','src','alt','title','colspan','rowspan','target','rel'],
        });
      }
    } catch (e) {
      console.warn('Markdown 渲染失败，退化为纯文本:', e);
    }
    return escapeHtml(mdText);
  }

  /**
   * 判断一段文本是否疑似 Markdown（用于决定是否启用 Markdown 渲染）。
   * 命中任一特征即视为 Markdown：
   *   - 标题（# 开头）
   *   - 加粗/斜体（**text** / *text* / __text__）
   *   - 列表（- / * / 1. 开头）
   *   - 表格（| ... |）
   *   - 代码块（``` 或 `code`）
   *   - 引用（> 开头）
   */
  function looksLikeMarkdown(text) {
    if (!text) return false;
    if (/^\s{0,3}#{1,6}\s/m.test(text)) return true;
    if (/(\*\*|__)[^*]+(\*\*|__)/m.test(text)) return true;
    if (/^\s{0,3}[-*+]\s/m.test(text)) return true;
    if (/^\s{0,3}\d+\.\s/m.test(text)) return true;
    if (/\|.*\|/m.test(text)) return true;
    if (/```/.test(text)) return true;
    if (/^\s{0,3}>/m.test(text)) return true;
    return false;
  }

  // ====== WebSocket 连接 ======
  function connectWS() {
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

    ws.onopen = () => {
      updateStatus('connected', '已连接');
      startHeartbeat();
      if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
      // 断线重连后，若没有正在运行的任务，应恢复"开始分析"按钮可点击
      refreshStartButtonState();
    };

    ws.onmessage = (event) => {
      try {
        const msg = JSON.parse(event.data);
        handleMessage(msg);
      } catch (e) {
        console.error('消息解析失败:', e);
      }
    };

    ws.onclose = () => {
      updateStatus('idle', '连接断开');
      stopHeartbeat();
      // 断线期间禁用"开始分析"按钮，避免在未连接状态下提交请求
      refreshStartButtonState();
      if (!reconnectTimer) {
        reconnectTimer = setTimeout(connectWS, 3000);
      }
    };

    ws.onerror = () => {
      updateStatus('idle', '连接错误');
    };
  }

  function startHeartbeat() {
    stopHeartbeat();
    heartbeatTimer = setInterval(() => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send('ping');
      }
    }, 30000);
  }

  function stopHeartbeat() {
    if (heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer = null; }
  }

  function updateStatus(state, text) {
    const dot = document.getElementById('statusDot');
    const textEl = document.getElementById('statusText');
    dot.className = 'status-dot ' + state;
    textEl.textContent = text;
  }

  // ============================================================================
  // UX 辅助函数
  // ============================================================================

  /**
   * 统一刷新"开始分析"按钮的可点击状态。
   * 规则：仅在 WebSocket 已连接且当前无运行中的分析任务时才可点击。
   * 这样可以杜绝：
   *   1. 分析过程中重复点击导致重复请求
   *   2. 断线期间误点提交，请求会被丢弃
   */
  function refreshStartButtonState() {
    const btn = document.getElementById('startBtn');
    if (!btn) return;
    const connected = ws && ws.readyState === WebSocket.OPEN;
    btn.disabled = isRunning || !connected;
  }

  /**
   * 批量禁用/启用左侧表单输入。
   * 分析进行中禁用，避免用户中途修改参数造成参数与正在运行的任务不一致。
   */
  function setFormDisabled(disabled) {
    FORM_ELEMENT_IDS.forEach(id => {
      const el = document.getElementById(id);
      if (el) el.disabled = disabled;
    });
  }

  /**
   * 启动耗时计时器：每秒刷新"已耗时 mm:ss"显示。
   * 仅在 analysis_start / status(running=true) 时调用一次。
   */
  function startElapsedTimer() {
    stopElapsedTimer();
    analysisStartTime = Date.now();
    const timerEl = document.getElementById('elapsedTimer');
    const textEl = document.getElementById('elapsedText');
    if (timerEl) {
      timerEl.style.display = 'inline-flex';
      timerEl.classList.add('running');
    }
    const tick = () => {
      const elapsed = Math.floor((Date.now() - analysisStartTime) / 1000);
      const mm = String(Math.floor(elapsed / 60)).padStart(2, '0');
      const ss = String(elapsed % 60).padStart(2, '0');
      if (textEl) textEl.textContent = `${mm}:${ss}`;
    };
    tick();
    elapsedTimerInterval = setInterval(tick, 1000);
  }

  /**
   * 停止耗时计时器并隐藏显示。
   * 在分析完成 / 出错 / 取消时调用。
   */
  function stopElapsedTimer() {
    if (elapsedTimerInterval) {
      clearInterval(elapsedTimerInterval);
      elapsedTimerInterval = null;
    }
    const timerEl = document.getElementById('elapsedTimer');
    if (timerEl) {
      timerEl.classList.remove('running');
      // 不立即隐藏，保留最后耗时显示 3 秒后淡出，便于用户看到总耗时
      setTimeout(() => {
        if (!isRunning) timerEl.style.display = 'none';
      }, 3000);
    }
  }

  /**
   * 切换自动滚动开关。
   * 用户主动点击按钮时切换状态；按钮文案与样式随之变化。
   */
  function toggleAutoScroll() {
    autoScrollEnabled = !autoScrollEnabled;
    const btn = document.getElementById('autoScrollBtn');
    const txt = document.getElementById('autoScrollText');
    if (btn) btn.classList.toggle('paused', !autoScrollEnabled);
    if (txt) txt.textContent = autoScrollEnabled ? '跟随' : '暂停';
    if (autoScrollEnabled) scrollLogToBottom();
  }

  /**
   * 把日志容器滚动到底部。仅在 autoScrollEnabled 为 true 时实际滚动。
   */
  function scrollLogToBottom() {
    if (!autoScrollEnabled) return;
    const logContainer = document.getElementById('logContainer');
    if (logContainer) logContainer.scrollTop = logContainer.scrollHeight;
  }

  // ====== 消息处理 ======
  function handleMessage(msg) {
    const logContainer = document.getElementById('logContainer');

    switch (msg.type) {
      case 'status':
        if (msg.data && msg.data.running) {
          // 后端告知有正在运行的任务（通常是页面刷新后重连时收到）
          isRunning = true;
          currentStage = 0;
          updateStatus('running', '分析中…');
          // 注意：不切换 display，而是用 disabled 控制按钮
          document.getElementById('stopBtn').style.display = 'block';
          setFormDisabled(true);
          refreshStartButtonState();
          startElapsedTimer();
          const startTxtS = document.getElementById('startBtnText');
          if (startTxtS) startTxtS.textContent = '分析中...';
          document.getElementById('resultPanel').classList.remove('visible');
          clearLogs();
        } else {
          isRunning = false;
          updateStatus('connected', '已连接');
          document.getElementById('stopBtn').style.display = 'none';
          setFormDisabled(false);
          refreshStartButtonState();
          stopElapsedTimer();
          // 恢复开始/停止按钮文案
          const startTxtS2 = document.getElementById('startBtnText');
          if (startTxtS2) startTxtS2.textContent = '开始分析';
          const stopTxt = document.getElementById('stopBtnText');
          if (stopTxt) stopTxt.textContent = '停止分析';
          const stopBtnEl = document.getElementById('stopBtn');
          if (stopBtnEl) stopBtnEl.disabled = false;
          updateProgress(0);
        }
        break;

      case 'analysis_start':
        // 后端真正开始分析：禁用表单、启动计时器
        setFormDisabled(true);
        startElapsedTimer();
        document.getElementById('stopBtn').style.display = 'block';
        refreshStartButtonState();
        addSystemEntry(`开始分析: ${msg.data.company}（${msg.data.date}）`);
        break;

      case 'node_change':
        currentStage++;
        updateProgress(Math.round((currentStage / totalStages) * 100));
        addNodeChangeEntry(msg.data.display, msg.data.category || 'system');
        break;

      case 'message':
        // 新结构：{node, display, category, role, text, tool_calls, tool_name, msg_type}
        addMessageEntry(msg.data);
        break;

      case 'progress':
        addSystemEntry(msg.data.message);
        break;

      case 'report_ready':
        // 某个分析阶段产出了完整报告（如 market_report、investment_plan 等）
        addReportCardEntry(msg.data);
        break;

      case 'analysis_complete':
        isRunning = false;
        // 若是用户取消，则在日志中标注
        const cancelled = msg.data && msg.data.cancelled;
        updateStatus('connected', cancelled ? '已取消' : '已连接');
        document.getElementById('stopBtn').style.display = 'none';
        setFormDisabled(false);
        refreshStartButtonState();
        stopElapsedTimer();
        // 恢复开始/停止按钮文案
        const startTxtC = document.getElementById('startBtnText');
        if (startTxtC) startTxtC.textContent = '开始分析';
        const stopTxtC = document.getElementById('stopBtnText');
        if (stopTxtC) stopTxtC.textContent = '停止分析';
        const stopBtnC = document.getElementById('stopBtn');
        if (stopBtnC) stopBtnC.disabled = false;
        updateProgress(cancelled ? 0 : 100);
        showResults(msg.data);
        addCompleteEntry(cancelled ? '分析已取消' : '分析完成！');
        break;

      case 'error':
        isRunning = false;
        updateStatus('connected', '已连接');
        document.getElementById('stopBtn').style.display = 'none';
        setFormDisabled(false);
        refreshStartButtonState();
        stopElapsedTimer();
        const startTxtE = document.getElementById('startBtnText');
        if (startTxtE) startTxtE.textContent = '开始分析';
        const stopTxtE = document.getElementById('stopBtnText');
        if (stopTxtE) stopTxtE.textContent = '停止分析';
        const stopBtnE = document.getElementById('stopBtn');
        if (stopBtnE) stopBtnE.disabled = false;
        updateProgress(0);
        addErrorEntry('分析失败: ' + (msg.data.message || '未知错误'));
        break;
    }
  }

  // ====== 日志条目构造辅助函数 ======
  // 通用骨架：创建带时间戳的 log-entry 容器
  function createBaseEntry(extraClass) {
    const entry = document.createElement('div');
    entry.className = 'log-entry ' + (extraClass || '');
    const time = document.createElement('div');
    time.className = 'log-time';
    time.textContent = new Date().toLocaleTimeString('zh-CN', { hour12: false });
    entry.appendChild(time);
    return entry;
  }

  function appendEntry(entry) {
    const logContainer = document.getElementById('logContainer');
    const empty = logContainer.querySelector('.empty-state');
    if (empty) empty.remove();
    logContainer.appendChild(entry);
    // 仅在用户开启自动滚动时跟随到底部；用户向上翻阅历史日志时不打扰
    if (autoScrollEnabled) {
      logContainer.scrollTop = logContainer.scrollHeight;
    }
    msgCount++;
    document.getElementById('msgCount').textContent = msgCount + ' 条';
  }

  // 系统消息（开始分析、progress、初始化等）
  function addSystemEntry(text) {
    const entry = createBaseEntry('system');
    const content = document.createElement('div');
    content.textContent = text;
    entry.appendChild(content);
    appendEntry(entry);
  }

  // 节点切换标题（紫色高亮）
  function addNodeChangeEntry(displayName, category) {
    const entry = createBaseEntry('node-change');
    entry.textContent = displayName;
    appendEntry(entry);
  }

  // 完成提示
  function addCompleteEntry(text) {
    const entry = createBaseEntry('complete');
    const content = document.createElement('div');
    content.textContent = text;
    entry.appendChild(content);
    appendEntry(entry);
  }

  // 错误提示
  function addErrorEntry(text) {
    const entry = createBaseEntry('error');
    const content = document.createElement('div');
    // 错误信息可能含 traceback，保留换行
    content.style.whiteSpace = 'pre-wrap';
    content.style.wordBreak = 'break-word';
    content.textContent = text;
    entry.appendChild(content);
    appendEntry(entry);
  }

  /**
   * 渲染一条智能体消息（来自 'message' 事件）。
   * data 字段：{node, display, category, role, text, tool_calls, tool_name}
   *
   * 渲染规则：
   *   - 顶部：发言人标签（带类别色点 + 中文名）
   *   - AI 消息含 tool_calls：单独渲染工具调用徽章列表
   *   - AI 消息文本：检测 Markdown，是则 Markdown 渲染，否则纯文本
   *   - Tool 消息：可折叠（默认折叠到 180px，超出显示展开按钮）
   *   - 长文本（>500 字）也支持折叠
   */
  function addMessageEntry(data) {
    const category = data.category || 'system';
    const role = data.role || 'system';
    const entry = createBaseEntry('cat-' + category);

    // 发言人标签
    if (data.display) {
      const speaker = document.createElement('div');
      speaker.className = 'msg-speaker';
      const dot = document.createElement('span');
      dot.className = 'speaker-dot';
      speaker.appendChild(dot);
      const nameText = document.createElement('span');
      nameText.textContent = data.display;
      speaker.appendChild(nameText);
      // 工具消息额外显示工具名
      if (role === 'tool' && data.tool_name) {
        const toolTag = document.createElement('span');
        toolTag.style.color = 'var(--gold)';
        toolTag.style.fontSize = '10px';
        toolTag.style.fontFamily = 'var(--font-mono)';
        toolTag.textContent = '· ' + data.tool_name;
        speaker.appendChild(toolTag);
      }
      // 模拟/缓存数据警告徽章：当真实数据源全部失败、降级到 cache 时，
      // 后端会在 is_simulated=true 标记。前端显示醒目警告，避免用户误以为是真实数据
      if (data.is_simulated) {
        const warn = document.createElement('span');
        warn.style.cssText = 'background:var(--red-bg);color:var(--red);border:1px solid rgba(239,68,68,0.4);padding:1px 8px;border-radius:10px;font-size:10px;font-weight:600;';
        warn.textContent = '⚠ 模拟数据（真实数据源失败）';
        speaker.appendChild(warn);
      }
      entry.appendChild(speaker);
    }

    // 消息主体
    const body = document.createElement('div');
    body.className = 'msg-body';

    // 工具调用徽章
    if (Array.isArray(data.tool_calls) && data.tool_calls.length > 0) {
      const tcList = document.createElement('div');
      tcList.className = 'tool-call-list';
      data.tool_calls.forEach(tc => {
        const badge = document.createElement('span');
        badge.className = 'tool-call-badge';
        badge.textContent = '🔧 ' + tc;
        tcList.appendChild(badge);
      });
      body.appendChild(tcList);
    }

    // 文本内容
    const text = data.text || '';
    if (text.trim()) {
      const textDiv = document.createElement('div');
      textDiv.className = 'msg-text';

      const isMd = looksLikeMarkdown(text);
      const textLen = text.length;
      // 长文本或 Markdown：用可折叠容器包裹
      const needCollapse = textLen > 500 || isMd;

      if (needCollapse) {
        if (isMd) {
          textDiv.classList.add('markdown');
          textDiv.innerHTML = renderMarkdown(text);
        } else {
          textDiv.textContent = text;
        }

        const wrapper = document.createElement('div');
        wrapper.className = 'collapsible collapsed';
        wrapper.appendChild(textDiv);

        const toggle = document.createElement('button');
        toggle.className = 'collapse-toggle';
        toggle.textContent = '展开 ▼';
        toggle.onclick = function() {
          if (wrapper.classList.contains('collapsed')) {
            wrapper.classList.remove('collapsed');
            wrapper.classList.add('expanded');
            toggle.textContent = '收起 ▲';
          } else {
            wrapper.classList.remove('expanded');
            wrapper.classList.add('collapsed');
            toggle.textContent = '展开 ▼';
          }
        };
        body.appendChild(wrapper);
        body.appendChild(toggle);
      } else {
        // 短文本：直接显示
        if (isMd) {
          textDiv.classList.add('markdown');
          textDiv.innerHTML = renderMarkdown(text);
        } else {
          textDiv.textContent = text;
        }
        body.appendChild(textDiv);
      }
    }

    entry.appendChild(body);
    appendEntry(entry);
  }

  /**
   * 渲染 report_ready 事件（某个分析阶段产出完整报告）。
   * data 字段：{field, title, content, node}
   * 在日志中插入一张迷你报告卡片，内容用 Markdown 渲染，默认折叠。
   */
  function addReportCardEntry(data) {
    const entry = createBaseEntry('report-card-entry');

    const title = document.createElement('div');
    title.className = 'report-title';
    title.textContent = data.title || '报告生成';
    entry.appendChild(title);

    const contentDiv = document.createElement('div');
    contentDiv.className = 'report-content markdown';
    contentDiv.innerHTML = renderMarkdown(data.content || '');

    const wrapper = document.createElement('div');
    wrapper.className = 'collapsible collapsed';
    wrapper.appendChild(contentDiv);

    const toggle = document.createElement('button');
    toggle.className = 'collapse-toggle';
    toggle.textContent = '展开查看 ▼';
    toggle.onclick = function() {
      if (wrapper.classList.contains('collapsed')) {
        wrapper.classList.remove('collapsed');
        wrapper.classList.add('expanded');
        toggle.textContent = '收起 ▲';
      } else {
        wrapper.classList.remove('expanded');
        wrapper.classList.add('collapsed');
        toggle.textContent = '展开查看 ▼';
      }
    };

    entry.appendChild(wrapper);
    entry.appendChild(toggle);
    appendEntry(entry);
  }

  function updateProgress(pct) {
    document.getElementById('progressBar').style.width = pct + '%';
  }

  function clearLogs() {
    const logContainer = document.getElementById('logContainer');
    logContainer.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📊</div>
        <div class="empty-title">等待分析开始</div>
        <div class="empty-desc">分析启动后，此处将实时显示智能体分析进度</div>
      </div>`;
    msgCount = 0;
    document.getElementById('msgCount').textContent = '等待中';
    updateProgress(0);
  }

  // ====== 结果显示 ======
  /**
   * 渲染最终分析结果面板。
   * data 字段：{decision, decision_text, reports, company, date}
   *   - decision: 单一信号词，可能值 BUY / OVERWEIGHT / HOLD / UNDERWEIGHT / SELL
   *               （由 SignalProcessor.process_signal 从 decision_text 中提取）
   *   - decision_text: 投资组合经理输出的完整决策文本（含 Markdown 加粗）
   *   - reports: 包含 7 个字段的完整报告字典
   *
   * 五级决策徽章映射：
   *   BUY / OVERWEIGHT → 偏多（绿色）
   *   HOLD             → 中性（金色）
   *   SELL / UNDERWEIGHT → 偏空（红色）
   */
  function showResults(data) {
    const panel = document.getElementById('resultPanel');
    const body = document.getElementById('resultBody');
    panel.classList.add('visible');

    // 决策徽章：规范化大小写后匹配五级
    const rawDecision = (data.decision || 'HOLD').toString().trim().toUpperCase();
    let badgeClass = 'hold';
    let emoji = '📊';
    let label = rawDecision;
    if (rawDecision === 'BUY')              { badgeClass = 'buy';         emoji = '📈'; label = '买入 BUY'; }
    else if (rawDecision === 'OVERWEIGHT')  { badgeClass = 'overweight';  emoji = '📈'; label = '超配 OVERWEIGHT'; }
    else if (rawDecision === 'SELL')        { badgeClass = 'sell';        emoji = '📉'; label = '卖出 SELL'; }
    else if (rawDecision === 'UNDERWEIGHT') { badgeClass = 'underweight'; emoji = '📉'; label = '低配 UNDERWEIGHT'; }
    else                                    { badgeClass = 'hold';        emoji = '⚖️'; label = '持有 HOLD'; }

    let html = `<span class="decision-badge ${badgeClass}">${emoji} ${label}</span>`;

    // 最终决策文本（来自 Portfolio Manager，含 Markdown 加粗与结构）
    if (data.decision_text) {
      html += `<div class="report-card">
        <div class="report-card-header" onclick="toggleCard(this)">
          <h4>📋 最终决策（投资组合经理）</h4>
          <span class="collapse-icon">▼</span>
        </div>
        <div class="report-card-body markdown">${renderMarkdown(data.decision_text)}</div>
      </div>`;
    }

    // 完整报告卡片（7 个字段，与后端 reports 字典 key 一一对应）
    // 顺序按分析流程排列：4 个分析师报告 → 研究经理计划 → 交易员执行方案
    const reports = data.reports || {};
    const reportDefs = [
      { key: 'market_report',         title: '📈 市场分析报告' },
      { key: 'news_report',           title: '📰 新闻分析报告' },
      { key: 'fundamentals_report',   title: '💰 基本面分析报告' },
      { key: 'sentiment_report',      title: '💬 社交媒体情绪报告' },
      { key: 'investment_plan',       title: '🎯 研究经理投资计划' },
      { key: 'trader_investment_plan',title: '⚡ 交易员执行方案' },
    ];

    reportDefs.forEach(def => {
      const content = reports[def.key];
      if (content && content.toString().trim()) {
        html += `<div class="report-card">
          <div class="report-card-header" onclick="toggleCard(this)">
            <h4>${def.title}</h4>
            <span class="collapse-icon">▼</span>
          </div>
          <div class="report-card-body markdown">${renderMarkdown(content)}</div>
        </div>`;
      }
    });

    body.innerHTML = html;
    panel.scrollIntoView({ behavior: 'smooth' });
  }

  function toggleCard(header) {
    header.classList.toggle('collapsed');
  }

  function escapeHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ====== 分析控制 ======
  async function startAnalysis() {
    if (isRunning) return;
    // WebSocket 未连接时直接拦截，避免请求被丢弃
    if (!ws || ws.readyState !== WebSocket.OPEN) {
      alert('与服务端的连接尚未建立，请稍候再试');
      return;
    }

    const company = document.getElementById('company').value.trim();
    const date = document.getElementById('date').value;
    if (!company || !date) {
      alert('请填写股票名称和分析日期');
      return;
    }

    const payload = {
      company: company,
      date: date,
      llm_provider: document.getElementById('llmProvider').value,
      deep_think_llm: document.getElementById('deepThinkLLM').value,
      quick_think_llm: document.getElementById('quickThinkLLM').value,
      max_debate_rounds: parseInt(document.getElementById('maxDebateRounds').value) || 1,
      max_risk_discuss_rounds: parseInt(document.getElementById('maxRiskRounds').value) || 1,
    };

    // 立即给用户视觉反馈：禁用按钮和表单，避免重复点击 / 重复提交
    // 真正的状态切换以 WebSocket 收到 analysis_start 为准，这里只是先行 UI 锁定
    isRunning = true;
    refreshStartButtonState();
    setFormDisabled(true);
    document.getElementById('stopBtn').style.display = 'block';
    document.getElementById('resultPanel').classList.remove('visible');
    clearLogs();
    currentStage = 0;
    updateProgress(0);
    // 按钮文案改为"分析中..."并加上旋转图标提示
    const startBtnText = document.getElementById('startBtnText');
    if (startBtnText) startBtnText.textContent = '分析中...';

    try {
      const resp = await fetch('/api/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const result = await resp.json();
      if (!result.success) {
        // 启动失败：回滚 UI 状态
        isRunning = false;
        refreshStartButtonState();
        setFormDisabled(false);
        document.getElementById('stopBtn').style.display = 'none';
        if (startBtnText) startBtnText.textContent = '开始分析';
        alert(result.message || '启动分析失败');
      }
      // 成功启动后由 WebSocket 推送 analysis_start 事件接管后续 UI 状态
    } catch (e) {
      // 网络异常：回滚 UI 状态
      isRunning = false;
      refreshStartButtonState();
      setFormDisabled(false);
      document.getElementById('stopBtn').style.display = 'none';
      if (startBtnText) startBtnText.textContent = '开始分析';
      alert('请求失败: ' + e.message);
    }
  }

  /**
   * 优雅停止分析：调用后端 /api/stop 端点，由后端在当前节点完成后退出循环。
   * 不再使用 location.reload() —— 那会粗暴刷新页面，丢失日志和已生成报告。
   *
   * 注意：这是协作式取消，后端会在当前 LLM 调用/工具调用完成后才退出，
   * 因此点击后按钮显示"停止中…等待当前步骤完成"，告知用户需要等待。
   */
  async function stopAnalysis() {
    const btn = document.getElementById('stopBtn');
    const txt = document.getElementById('stopBtnText');
    if (btn) btn.disabled = true;
    // 文案明确告知用户：取消是协作式的，需要等当前步骤完成
    if (txt) txt.textContent = '停止中…等待当前步骤完成';
    try {
      const resp = await fetch('/api/stop', { method: 'POST' });
      const result = await resp.json();
      if (!result.success) {
        // 当前没有运行任务：直接恢复 UI
        if (txt) txt.textContent = '停止分析';
        if (btn) btn.disabled = false;
      }
      // 真正的"已停止"由后端推送 analysis_complete(cancelled=true) 触发，
      // handleMessage 会重置按钮文案与表单状态
    } catch (e) {
      console.error('停止请求失败:', e);
      if (txt) txt.textContent = '停止分析';
      if (btn) btn.disabled = false;
    }
  }

  // ====== 初始化 ======
  // 初始状态下 WebSocket 尚未连接，"开始分析"按钮应禁用
  refreshStartButtonState();
  connectWS();

  // 设置默认日期为今天
  const today = new Date();
  const dateStr = today.toISOString().split('T')[0];
  document.getElementById('date').value = dateStr;

  // 监听日志容器滚动事件：用户主动向上滚动时自动暂停"跟随"，
  // 重新滚动到底部附近时自动恢复"跟随"，无需手动点击按钮
  (function setupScrollListener() {
    const logContainer = document.getElementById('logContainer');
    if (!logContainer) return;
    let userScrolling = false;
    logContainer.addEventListener('scroll', () => {
      // 判断是否已接近底部（容差 30px），如果是则视为"跟随到底部"
      const atBottom = logContainer.scrollHeight - logContainer.scrollTop - logContainer.clientHeight < 30;
      if (!atBottom && autoScrollEnabled) {
        // 用户向上滚动：自动暂停跟随
        autoScrollEnabled = false;
        const btn = document.getElementById('autoScrollBtn');
        const txt = document.getElementById('autoScrollText');
        if (btn) btn.classList.add('paused');
        if (txt) txt.textContent = '暂停';
      } else if (atBottom && !autoScrollEnabled) {
        // 用户重新滚到底部：自动恢复跟随
        autoScrollEnabled = true;
        const btn = document.getElementById('autoScrollBtn');
        const txt = document.getElementById('autoScrollText');
        if (btn) btn.classList.remove('paused');
        if (txt) txt.textContent = '跟随';
      }
    });
  })();
</script>
